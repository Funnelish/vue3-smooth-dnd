name: CI

# Runs on the integration branch and on every release PR into PROD,
# so a release is verified before the merge that publishes it.
on:
  push:
    branches: [main, PROD]
  pull_request:
    branches: [main, PROD]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
          scope: '@funnelish'

      # NPM_AUTH_TOKEN, not GITHUB_TOKEN: @funnelish/smooth-dnd is published by
      # a different repo, and this repo's GITHUB_TOKEN has no read access to
      # it (403). Same org-level secret fnsh_base already installs with.
      - name: Install dependencies
        run: pnpm install --filter @funnelish/vue3-smooth-dnd... --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: Build library
        run: pnpm --filter @funnelish/vue3-smooth-dnd build

      - name: Verify build output
        working-directory: packages/lib
        run: |
          test -s dist/vue3-smooth-dnd.esm.js
          test -s dist/vue3-smooth-dnd.js
          test -s dist/vue3-smooth-dnd.global.js

      # Surfaces exactly which files would ship, so an accidental change to
      # `files` is visible in the PR rather than after publishing.
      - name: Report packed contents
        working-directory: packages/lib
        run: pnpm pack --dry-run
