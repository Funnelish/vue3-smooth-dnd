name: Release @funnelish/vue3-smooth-dnd

# Publishes only from PROD. `main` is the integration branch and never
# reaches the registry. A release is a PR from main -> PROD.
#
# Only packages/lib is published; packages/example is a demo app and is
# never installed or built here.
on:
  push:
    branches:
      - PROD
  workflow_dispatch:

# Least privilege by default; each job opts into exactly what it needs.
permissions:
  contents: read

# Two releases must never race the registry.
concurrency:
  group: release-vue3-smooth-dnd
  cancel-in-progress: false

jobs:
  verify:
    name: Build & pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      already-published: ${{ steps.check.outputs.exists }}
    steps:
      # Actions are pinned to commit SHAs: a mutable tag like @v7 can be
      # repointed at malicious code by a compromised action repo.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
          scope: '@funnelish'

      # --filter keeps the demo app out of the install entirely.
      # --ignore-scripts blocks arbitrary install-time code from the
      # dependency tree; the rollup build needs no install hooks.
      - name: Install dependencies
        run: pnpm install --filter @funnelish/vue3-smooth-dnd... --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: pkg
        working-directory: packages/lib
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if npm view "@funnelish/vue3-smooth-dnd@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@funnelish/vue3-smooth-dnd@${{ steps.pkg.outputs.version }} already exists — publish will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build library
        run: pnpm --filter @funnelish/vue3-smooth-dnd build

      - name: Verify build output
        working-directory: packages/lib
        run: |
          test -s dist/vue3-smooth-dnd.esm.js
          test -s dist/vue3-smooth-dnd.js
          test -s dist/vue3-smooth-dnd.global.js

      # `smooth-dnd` and `vue` stay external in the bundle, so the published
      # package must declare them. Guard against that pairing drifting.
      - name: Verify externals are declared
        working-directory: packages/lib
        run: |
          node -e "
            const pkg = require('./package.json');
            if (!pkg.dependencies['smooth-dnd']) throw new Error('smooth-dnd must remain a declared dependency: it is external in the bundle');
            if (!pkg.peerDependencies?.vue) throw new Error('vue must remain a peerDependency: it is external in the bundle');
          "

      # Pack here so the bytes that get published are exactly the bytes
      # that were built and checked. The publish job never rebuilds.
      - name: Pack tarball
        working-directory: packages/lib
        run: pnpm pack --pack-destination ../../artifact

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: artifact/*.tgz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages
    needs: verify
    if: needs.verify.outputs.already-published == 'false'
    runs-on: ubuntu-latest
    # Protected environment: required reviewers, restricted to the PROD branch.
    environment:
      name: production
      url: https://github.com/Funnelish/vue3-smooth-dnd/pkgs/npm/vue3-smooth-dnd
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # Deliberately no checkout and no install: nothing from the repo or
      # its dependency tree executes in the job holding packages:write.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
          scope: '@funnelish'

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: artifact

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifact/*.tgz'

      - name: Publish
        run: npm publish artifact/*.tgz --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag:
    name: Tag release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --generate-notes
